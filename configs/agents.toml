# Agents available to scripts/run_agents.py. One [agents.<name>] table per agent.
#
#   type = "cli"     command-line coding agent run in an empty folder holding only
#                    input.xlsx and TASK.md; "{prompt}" becomes a one-line prompt that
#                    points at TASK.md. The agent must save output.xlsx.
#   type = "chat"    any OpenAI-compatible /chat/completions API. The model gets the
#                    workbook as text and replies with JSON cell edits.
#   type = "manual"  a person solves TASK.md in a chat UI and saves output.xlsx into
#                    results/runs/<run>/<agent>/<case>/; re-run to grade it.
#
# `setup` is shown by `run_agents.py --list` for agents that are not ready yet.
# Never put API keys in this file: `api_key_env` names the environment variable, read
# from the environment or from a git-ignored .env file (see .env.example).
# Model ids below are examples; check each provider's current model list.
#
# Beyond these named agents, any model a [providers.*] table serves runs as
#   --agents <provider>:<model-id>   e.g. openrouter:z-ai/glm-5.2:free, ollama:llama3.1:8b

# --- Command-line coding agents --------------------------------------------------

[agents.claude-code]
type = "cli"
setup = "npm install -g @anthropic-ai/claude-code (or use the copy bundled with the Claude desktop app), then run `claude` once and type /login"
# Headless Claude Code; tools limited to file edits and Python (e.g. openpyxl).
command = [
    "claude", "-p", "{prompt}",
    "--output-format", "json",
    "--no-session-persistence",
    "--permission-mode", "dontAsk",
    "--allowedTools", "Read", "Write", "Edit", "Glob", "Grep",
    "Bash(python:*)", "Bash(python3:*)", "Bash(py:*)",
]
# The Claude desktop app bundles Claude Code outside PATH; newest version wins.
fallback_paths = ["~/AppData/Roaming/Claude/claude-code/*/claude.exe"]
timeout = 900

[agents.gemini-cli]
type = "cli"
setup = "npm install -g @google/gemini-cli, then run `gemini` once to sign in with Google, or set GEMINI_API_KEY"
# Google's Gemini CLI (npm install -g @google/gemini-cli); needs GEMINI_API_KEY or a
# Google login. --yolo auto-approves its tool calls inside the task folder.
command = ["gemini", "--yolo", "-p", "{prompt}"]
timeout = 900

[agents.codex]
type = "cli"
setup = "npm install -g @openai/codex, then run `codex` once to sign in with ChatGPT, or set OPENAI_API_KEY"
# OpenAI Codex CLI in non-interactive mode. The benchmark already isolates each
# case in a temporary folder containing only input.xlsx and TASK.md.
command = [
    "codex", "exec",
    "--skip-git-repo-check",
    # Avoid Windows sandbox ACLs that make output.xlsx unreadable to the runner.
    "--dangerously-bypass-approvals-and-sandbox",
    "--ephemeral",
    "{prompt}",
]
# Standalone Codex installs to %LOCALAPPDATA%; the VS Code/ChatGPT extension
# also bundles codex.exe outside PATH on some Windows setups.
fallback_paths = [
    "~/AppData/Local/Programs/OpenAI/Codex/bin/codex.exe",
    "~/.vscode/extensions/openai.chatgpt-*/bin/windows-x86_64/codex.exe",
]
timeout = 900

[agents.opencode]
type = "cli"
setup = "npm install -g opencode-ai, then `opencode auth login` with an OpenCode Zen account (model opencode/glm-5.2)"
# Paid OpenCode Zen account. The inline config keeps benchmark runs focused on
# the local workbook: no web access, subagents or files outside the isolated
# case directory. Python remains available for editing the workbook with
# openpyxl from the uv environment that launches the suite.
command = [
    "opencode", "run",
    "--pure",
    "--auto",
    "--model", "opencode/glm-5.2",
    "--format", "json",
    "{prompt} Work only in the current directory. Use Python with openpyxl to edit the workbook. Prioritize creating output.xlsx before optional analysis, then verify that the file exists. Do not use web tools, Excel, LibreOffice, or stop system processes.",
]
timeout = 900

[agents.opencode.env]
OPENCODE_DISABLE_AUTOUPDATE = "true"
OPENCODE_CONFIG_CONTENT = '''
{
  "$schema": "https://opencode.ai/config.json",
  "permission": {
    "read": "allow",
    "edit": "allow",
    "glob": "allow",
    "grep": "allow",
    "list": "allow",
    "bash": {
      "*": "deny",
      "python": "allow",
      "python *": "allow",
      "python3": "allow",
      "python3 *": "allow",
      "py": "allow",
      "py *": "allow",
      "uv run python *": "allow"
    },
    "task": "deny",
    "external_directory": "deny",
    "webfetch": "deny",
    "websearch": "deny",
    "question": "deny"
  }
}
'''

# --- Chat models over OpenAI-compatible APIs --------------------------------------

[agents.gemini-flash]
type = "chat"
setup = "create a free API key at https://aistudio.google.com/app/apikey and add GEMINI_API_KEY=... to .env"
# Free tier available with an API key from Google AI Studio.
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-2.5-flash"
api_key_env = "GEMINI_API_KEY"

[agents.gemini-pro]
type = "chat"
setup = "create an API key at https://aistudio.google.com/app/apikey and add GEMINI_API_KEY=... to .env"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-2.5-pro"
api_key_env = "GEMINI_API_KEY"

[agents.openrouter-free]
type = "chat"
setup = "create an API key at https://openrouter.ai/keys and add OPENROUTER_API_KEY=... to .env"
# OpenRouter lists free models with a ":free" suffix.
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.2:free"
api_key_env = "OPENROUTER_API_KEY"

[agents.groq-llama]
type = "chat"
setup = "create an API key at https://console.groq.com/keys and add GROQ_API_KEY=... to .env"
base_url = "https://api.groq.com/openai/v1"
model = "llama-3.3-70b-versatile"
api_key_env = "GROQ_API_KEY"

[agents.ollama-qwen]
type = "chat"
setup = "install Ollama from https://ollama.com/download, then `ollama pull qwen2.5:7b` (about 4.7 GB)"
# Local and free: `ollama pull qwen2.5:7b` first. No API key needed.
base_url = "http://localhost:11434/v1"
model = "qwen2.5:7b"
timeout = 1800

# --- Any model from a provider: --agents <provider>:<model-id> ----------------------
# OpenAI-compatible endpoints that serve many models. `models` says where to find ids.

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
models = "460+ models from 63 providers, 20 free: https://openrouter.ai/models"
setup = "create an API key at https://openrouter.ai/keys and add OPENROUTER_API_KEY=... to .env"

[providers.litellm]
# A LiteLLM proxy in front of 130+ providers (Anthropic, OpenAI, Bedrock, Vertex, Azure...).
base_url = "http://localhost:4000/v1"
api_key_env = "LITELLM_API_KEY"
api_key_optional = true
models = "3,400+ chat models from 130+ providers: https://models.litellm.ai"
setup = "start a LiteLLM proxy on port 4000 (https://docs.litellm.ai/docs/simple_proxy), e.g. uvx --from 'litellm[proxy]' litellm --model <provider>/<model>"

[providers.ollama]
base_url = "http://localhost:11434/v1"
models = "any model you pull: https://ollama.com/library"
setup = "install Ollama from https://ollama.com/download, then `ollama pull <model>`"
timeout = 1800

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
models = "https://platform.openai.com/docs/models"
setup = "create an API key at https://platform.openai.com/api-keys and add OPENAI_API_KEY=... to .env"

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
models = "https://ai.google.dev/gemini-api/docs/models"
setup = "create a free API key at https://aistudio.google.com/app/apikey and add GEMINI_API_KEY=... to .env"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
models = "https://console.groq.com/docs/models"
setup = "create an API key at https://console.groq.com/keys and add GROQ_API_KEY=... to .env"

# --- People using chat UIs --------------------------------------------------------

[agents.chatgpt-manual]
type = "manual"
setup = "none: give TASK.md and input.xlsx from the run folder to ChatGPT, save its workbook there as output.xlsx, then run the same command again"

[agents.excel-copilot-manual]
type = "manual"
setup = "none: open input.xlsx from the run folder in Excel, follow TASK.md with Copilot, save as output.xlsx there, then run the same command again"
